# Estate node gate (bun; no unit tests on a docs site) + contract.
# Monthly bitrot cron catches ecosystem drift push/PR never see.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 1 * *" # monthly bitrot

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: WyattAu/engineering-standards/.github/workflows/node-ci.yml@e3a75c976fad58db1a68523cb525052cdcd2da0e # main
    with:
      package-manager: bun
      test: true

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ./scripts/check-contract.sh

  # Loop 2: performance budget - blocking since it stayed green for a full
  # loop (LOOP.md graduation policy). Same scripts/ command a developer runs
  # locally; never a CI-only measurement path.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: make bench

  # Loop 3: determinism verification - blocking since it stayed green for a
  # full loop, and since measurement showed every toolchain in the estate is
  # byte-reproducible (ADR: determinism verification). Same scripts/ command a
  # developer runs locally.
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: make repro
